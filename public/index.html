<!DOCTYPE html>
<html>

<head>
  <title>Hammer Time</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="main.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      color: #eee;
      font-family: 'Helvetica', Arial,sans-serif;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: none;
    }

    body {
      background: var(--background-color, #111);
    }

    body.running{
      background-color: var(--background-color-running, #44ff00);
    }

    body.warning {
      background-color: var(--background-color-warning, #222);
    }
    
    body.critical {
      background-color: var(--background-color-critical, #222);
    }

    #timer {
      font-size: 28vw;
      font-weight: bold;
      line-height: 1;
      transition: color 0.5s;
      text-align: center;
      color: var(--timer-color, #ffffff) !important;
    }

    body.running #timer {
      color: var(--timer-color-running, #000000) !important;
    }

    body.warning #timer {
      color: var(--timer-color-warning, #ffa600) !important;
    }

    body.critical #timer {
      color: var(--timer-color-critical, #ff0000) !important;
    }

    #timer .small-sec {
      font-size: 0.3em;
      vertical-align: super;
    }

    #label {
      font-size: 5vw;
      margin-bottom: 2vh;
      text-align: center;
      transition: font-size 0.3s ease;
      color: var(--status-color, #eee);
    }

    body.running #label {
      color: var(--status-color-running, #eee);
    }

    body.warning #label {
      color: var(--status-color-warning, #eee);
    }

    body.critical #label {
      color: var(--status-color-critical, #eee);
    }

    #message {
      font-size: 5vw;
      text-align: center;
      max-width: 90vw;
      line-height: 1.2;
    }

    body.running #message {
      color: var(--message-color-running, #ccc);
    }

    body.warning #message {
      color: var(--message-color-warning, #ccc);
    }

    body.critical #message {
      color: var(--message-color-critical, #ccc);
    }

    .no-timer #label,
    .no-timer #message {
      font-size: 8vw;
    }

    #timer {
      font-size: var(--timer-font-size, 28vw);
    }

    #label {
      font-size: var(--label-font-size, 5vw);
    }

    #message {
      font-size: var(--message-font-size, 5vw);
    }

    #ip-display {
      position: fixed;
      right: 0.8vw;
      bottom: 0.8vh;
      font-size: max(0.8vw, 12px);
      color: #d8d4c8;
      opacity: 0.6;
      z-index: 5;
    }

    #local-badge {
      position: fixed;
      top: 1vh;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.3em 0.8em;
      border-radius: 0.4em;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: max(2vw, 16px);
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    /* Dialog and button styles mirror settings.css */
    .btn {
      padding: 0.55rem 1.2rem;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-primary {
      background: #0077cc;
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      border-color: #e5e7eb;
      color: #1f2328;
    }

    #local-delete {
      position: fixed;
      left: 0.8vw;
      bottom: 0.8vh;
      padding: 0.6rem;
      font-size: 1rem;
      color: #b91c1c;
      opacity: 0.85;
    }

    #local-dialog {
      width: min(420px, 90vw);
      padding: 1.25rem;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      color: #1f2328;
      cursor: auto;
    }

    #local-dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    #local-dialog p {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    #local-dialog label {
      display: block;
      margin-bottom: 0.9rem;
      font-size: 0.95rem;
    }

    #local-dialog input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.35rem;
      padding: 0.45rem 0.6rem;
      font-size: 0.95rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #1f2328;
    }

    #local-dialog input:focus {
      outline: 2px solid #0077cc;
      outline-offset: 1px;
      border-color: transparent;
    }

    .dialog-actions {
      display: flex;
      flex-direction: row-reverse; /* primary button comes first in the DOM so Enter submits it */
      gap: 0.6rem;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="label">Loading...</div>
  <div id="timer">--:--</div>
  <div id="message"></div>
  <div id="ip-display"></div>
  <div id="local-badge" hidden>LOCAL TIMER</div>
  <button id="local-delete" class="btn btn-ghost" hidden>Delete local timer</button>

  <dialog id="local-dialog">
    <form id="local-ask" method="dialog">
      <p>Start a local timer on this screen?</p>
      <div class="dialog-actions">
        <button type="button" id="local-yes" class="btn btn-primary">Yes</button>
        <button value="no" class="btn btn-ghost">No</button>
      </div>
    </form>
    <form id="local-form" method="dialog" hidden>
      <label>Game duration (minutes)
        <input id="local-duration" type="number" min="1" max="600" required>
      </label>
      <label>Message (optional)
        <input id="local-message" type="text" maxlength="100">
      </label>
      <div class="dialog-actions">
        <button value="start" class="btn btn-primary">Start</button>
        <button value="cancel" formnovalidate class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </dialog>
  <audio id="firstcall" src="firstcall.mp3" preload="auto"></audio>

  <script src="app.js"></script>
</body>

</html>
