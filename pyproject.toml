# Note: the application/schema version lives in `hammertime/__init__.py` only, so it
# cannot drift from the migration gate. This file holds tooling configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not visual'"
markers = [
  "slow: long-running checks (the 20 s heartbeat / 60 s state tick)",
  "visual: browser screenshot baselines; run with `pytest -m visual`",
]
